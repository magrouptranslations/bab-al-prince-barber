<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07110f"><title>VIGOR 365</title><style>html,body{margin:0;background:#06100e;color:#f4f0e8;font-family:Arial,sans-serif;height:100%}.load{height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}.ring{width:54px;height:54px;border:2px solid #22332e;border-top-color:#dfc79d;border-radius:50%;animation:s 1s linear infinite;margin:auto auto 18px}@keyframes s{to{transform:rotate(360deg)}}small{color:#9aaba4;line-height:1.8}.retry{display:inline-block;margin-top:18px;padding:10px 16px;border:1px solid #40534c;border-radius:12px;color:#f4f0e8;text-decoration:none}</style></head><body><div class="load"><div><div class="ring"></div><b>VIGOR 365</b><br><small>جاري تحميل النسخة الكاملة…</small></div></div><script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script><script>(async()=>{try{if(!window.pako)throw new Error('pako');const base='https://vigor365-premium.vercel.app/';const parts=await Promise.all([1,2,3,4].map(n=>fetch(base+'payload-'+n+'.txt',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('payload-'+n);return r.text()})));const bin=atob(parts.join('').replace(/\s+/g,''));const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const html=new TextDecoder('utf-8').decode(pako.ungzip(bytes));document.open();document.write(html);document.close()}catch(e){console.error(e);document.body.innerHTML='<div class="load"><div><b>تعذر تحميل VIGOR 365</b><br><small>جرّب فتح الرابط في Chrome أو Samsung Internet بعد التأكد من اتصال الإنترنت.</small><br><a class="retry" href="javascript:location.reload()">إعادة المحاولة</a></div></div>'}})();</script></body></html>
