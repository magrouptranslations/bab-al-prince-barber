name: Import Bab Al Prince Site

on:
  push:
    paths:
      - site-package.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract website package
        run: |
          rm -rf .site-import
          mkdir .site-import
          unzip -q site-package.zip -d .site-import
          SRC=".site-import/Bab_Al_Prince_Website"
          if [ ! -d "$SRC" ]; then
            SRC="$(find .site-import -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          fi
          cp -a "$SRC"/. ./
          rm -rf .site-import site-package.zip

      - name: Commit imported website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Import complete Bab Al Prince website"
            git push
          fi
